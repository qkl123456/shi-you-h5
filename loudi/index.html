<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涟水湘山俱有灵 · 娄底古风游览图</title>
<style>
:root{
  --paper:#f6efe2; --paper2:#ece0cd; --paper3:#e2d3ba;
  --ink:#2c2925; --ink2:#736a5f; --ink3:#a2988a;
  --red:#a8342a; --red2:#c2564a;
  --jade:#4e7a72; --jade2:#7d9e94;
  --gold:#b08d57;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC","STSong",serif;
  --hei:"PingFang SC","Microsoft YaHei","微软雅黑",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:
    radial-gradient(120% 80% at 50% 0%, #fbf6ec 0%, var(--paper) 40%, var(--paper2) 100%),
    var(--paper);
  color:var(--ink); font-family:var(--kai); line-height:1.9;
  min-height:100vh; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.35; z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.28'/></svg>");
}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 16px 60px}

/* ---------- 题头 ---------- */
header{text-align:center;padding:14px 0 6px;position:relative}
.title{
  font-size:clamp(30px,6.4vw,52px);letter-spacing:.22em;margin:0 0 6px;
  color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.7);font-weight:400;
}
.title em{font-style:normal;color:var(--red)}
.subtitle{font-size:clamp(13px,3.1vw,17px);letter-spacing:.42em;color:var(--ink2);margin:0}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 4px;max-width:520px}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--ink3),transparent)}
.rule span{font-size:12px;letter-spacing:.5em;color:var(--ink3)}
.seal{
  position:absolute;right:6px;top:4px;width:64px;height:64px;border:2.5px solid var(--red);
  border-radius:6px;color:var(--red);display:flex;align-items:center;justify-content:center;
  font-size:15px;line-height:1.05;letter-spacing:1px;text-align:center;opacity:.85;
  transform:rotate(-6deg);animation:sealIn 1.4s ease both;
}
@keyframes sealIn{from{opacity:0;transform:rotate(-18deg) scale(1.25)}to{opacity:.85;transform:rotate(-6deg) scale(1)}}

/* ---------- 工具条 ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px 0 8px}
.chip{
  font-family:var(--kai);font-size:14px;padding:5px 16px;border:1px solid var(--ink3);
  border-radius:999px;background:rgba(255,255,255,.35);color:var(--ink2);cursor:pointer;
  transition:.25s;letter-spacing:.12em;white-space:nowrap;flex:0 0 auto;
}
.chip:hover{border-color:var(--ink2);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.go{border-color:var(--red);color:var(--red)}
.chip.go.on{background:var(--red);color:#fff}

/* ---------- 主舞台 ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;margin-top:6px}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
.mapbox{
  position:relative;border:1px solid var(--ink3);border-radius:4px;overflow:hidden;
  background:linear-gradient(160deg,#f8f2e6,#eadfc9);
  box-shadow:0 2px 20px rgba(80,60,30,.10) inset,0 6px 22px rgba(90,70,40,.08);
  align-self:start;
}
.mapbox svg{display:block;width:100%;height:auto}
.panel{min-width:0}

/* ---------- 热点 ---------- */
.hot{cursor:pointer}
.hot .dot{opacity:.92}
.hot .ring{fill:none;stroke-width:1.4;opacity:.55;transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
.hot .ring2{animation-delay:.9s}
.hot[data-c="山"] .dot{fill:var(--jade)} .hot[data-c="山"] .ring{stroke:var(--jade)}
.hot[data-c="人"] .dot{fill:var(--red)} .hot[data-c="人"] .ring{stroke:var(--red)}
.hot[data-c="物"] .dot{fill:var(--gold)} .hot[data-c="物"] .ring{stroke:var(--gold)}
#legend{font-family:var(--kai);font-size:14px;letter-spacing:.1em}
#legend circle{opacity:.9}
#legend t{fill:var(--ink2);font-family:var(--kai)}
.hot .lbl{font-family:var(--kai);font-size:17px;fill:var(--ink);paint-order:stroke;stroke:rgba(248,242,232,.92);stroke-width:4px;letter-spacing:.06em}
.hot .lbl2{font-family:var(--kai);font-size:13px;fill:var(--ink2);paint-order:stroke;stroke:rgba(248,242,232,.92);stroke-width:3.5px}
.hot:hover .lbl{fill:var(--red)}
.hot.act .dot{fill:var(--red)}
.hot.act .ring{stroke:var(--red);animation:pulseS 1.6s ease-out infinite}
@keyframes pulse{0%{r:6;opacity:.6}70%{r:20;opacity:0}100%{r:20;opacity:0}}
@keyframes pulseS{0%{r:8;opacity:.75}100%{r:32;opacity:0}}
.cty{font-family:var(--kai);font-size:30px;fill:var(--ink2);opacity:.30;letter-spacing:.4em}
.cty2{font-family:var(--kai);font-size:13px;fill:var(--ink2);opacity:.34;letter-spacing:.28em}
.wave{stroke:var(--jade);stroke-width:1.6;fill:none;opacity:.5;stroke-dasharray:14 10;animation:flow 3.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.ctext{font-family:var(--kai);font-size:20px;fill:var(--ink);opacity:.40;letter-spacing:.18em}
.cloud{animation:drift 26s ease-in-out infinite}
.cloud2{animation:drift 34s ease-in-out infinite reverse}
@keyframes drift{0%{transform:translateX(-22px)}50%{transform:translateX(26px)}100%{transform:translateX(-22px)}}
.mist{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.16}50%{opacity:.42}}
.flick{animation:breathe 4.5s ease-in-out infinite}

/* ---------- 卷轴卡片 ---------- */
.card{
  border:1px solid var(--ink3);border-radius:3px;background:linear-gradient(180deg,#fbf7ee,#f3ead8);
  min-height:420px;position:relative;overflow:hidden;
}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--ink3) 0 2px,transparent 2px 7px);opacity:.5}
.crow{display:flex;gap:16px;padding:16px 18px 18px;align-items:flex-start}
.pic{
  flex:0 0 auto;width:186px;border:1px solid var(--ink3);background:#fff;
  box-shadow:2px 3px 0 rgba(120,100,70,.13);display:flex;flex-direction:column;align-items:stretch;
  align-self:flex-start;
}
.pic img{width:100%;height:auto;display:block;max-height:330px;object-fit:contain}
.piccap{font-size:11px;color:var(--ink3);text-align:center;padding:3px 0 6px;font-family:var(--hei)}
.info{flex:1;min-width:0}
.cn{font-size:27px;letter-spacing:.14em;margin:0 0 2px;color:var(--ink);font-weight:400}
.cloc{font-size:12.5px;color:var(--jade);letter-spacing:.16em;font-family:var(--hei);margin-bottom:8px}
.ctags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:11px;padding:2px 9px;border-radius:2px;font-family:var(--hei);letter-spacing:.08em;
  background:rgba(78,122,114,.12);color:var(--jade);border:1px solid rgba(78,122,114,.3)}
.tag.r{background:rgba(168,52,42,.10);color:var(--red);border-color:rgba(168,52,42,.28)}
.quote{border-left:2px solid var(--red);padding:6px 0 6px 12px;margin:6px 0 10px}
.qt{font-size:16.5px;color:var(--ink);letter-spacing:.08em}
.qa{font-size:12.5px;color:var(--ink2);font-family:var(--hei);letter-spacing:.06em}
.qlab{display:inline-block;font-family:var(--hei);font-size:11.5px;letter-spacing:.12em;
  color:var(--red);border:1px solid rgba(150,70,55,.4);border-radius:2px;padding:1px 7px;margin-bottom:6px;opacity:.9}
.qn{font-size:12.6px;color:var(--ink2);font-family:var(--hei);line-height:1.9;margin-top:7px;
  padding-top:7px;border-top:1px dashed rgba(120,110,95,.32)}
.quote.nopoem{border-left-color:var(--ink3)}
.quote.nopoem .qlab{color:var(--ink2);border-color:var(--ink3)}
.disc{font-family:var(--hei);font-size:12.6px;color:var(--ink2);line-height:1.95;margin:16px 0 0;
  padding:11px 15px;border:1px dashed var(--ink3);border-radius:3px;background:rgba(255,255,255,.35);text-align:left}
.disc b{color:var(--red);font-weight:400}
.body{font-size:14.6px;color:var(--ink2);text-align:justify;padding-right:2px}
.body p{margin:0 0 8px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:13.6px;color:var(--ink2);margin-top:8px;font-family:var(--hei)}
.kv b{font-weight:400;color:var(--red);font-family:var(--kai);letter-spacing:.2em;font-size:14px;white-space:nowrap}
.tips{font-size:13.2px;color:var(--ink2);background:rgba(46,41,37,.045);border:1px dashed var(--ink3);
  padding:8px 11px;margin-top:10px;font-family:var(--hei);line-height:1.85}
.tips b{color:var(--red);letter-spacing:.14em}
@media(max-width:540px){
  .crow{flex-direction:column;align-items:stretch}
  .pic{width:100%;max-width:250px;margin:0 auto}
  .pic img{max-height:230px}
  .seal{width:46px;height:46px;font-size:11px;right:2px;top:0}
  .title{letter-spacing:.12em}
  .bar{gap:6px}
  .chip{padding:4px 12px;font-size:13px}
}
.more{font-size:12.5px;color:var(--gold);cursor:pointer;font-family:var(--hei);margin-top:8px;text-decoration:underline dotted;letter-spacing:.1em}
.full{display:none;font-size:14px;color:var(--ink2);line-height:2;padding:8px 12px;background:rgba(46,41,37,.03);
  margin-top:8px;font-family:var(--kai);letter-spacing:.06em}
.full.on{display:block}
.empty{display:flex;align-items:center;justify-content:center;height:420px;color:var(--ink3);font-size:15px;letter-spacing:.3em;text-align:center;padding:20px}
.tin{animation:tin .5s cubic-bezier(.2,.9,.2,1) both}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 卷次 / 时间轴 ---------- */
.tl{margin-top:22px;border:1px solid var(--ink3);background:linear-gradient(180deg,#f9f4e9,#f1e7d4);padding:16px 18px 20px;border-radius:3px}
.tlh{font-size:16px;letter-spacing:.3em;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:10px}
.tlh::after{content:"";flex:1;height:1px;background:var(--ink3);opacity:.6}
.era{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:760px){.era{grid-template-columns:1fr 1fr}}
@media(max-width:430px){.era{grid-template-columns:1fr}}
.era div{border-left:2px solid var(--jade);padding:2px 0 2px 11px;position:relative}
.era div::before{content:"";position:absolute;left:-5px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--jade)}
.era b{display:block;font-size:15px;letter-spacing:.16em;color:var(--ink);font-weight:400}
.era s{display:block;text-decoration:none;font-size:11.5px;color:var(--jade);font-family:var(--hei);letter-spacing:.06em}
.era i{display:block;font-style:normal;font-size:12.8px;color:var(--ink2);line-height:1.8;margin-top:2px}
.persons{margin-top:14px;font-size:13.4px;color:var(--ink2);line-height:2;font-family:var(--hei)}
.persons b{color:var(--red);font-weight:400;font-family:var(--kai);letter-spacing:.1em;font-size:14.5px}
footer{margin-top:20px;text-align:center;font-size:12px;color:var(--ink3);font-family:var(--hei);line-height:2;letter-spacing:.06em}
.title-wrap{display:block}

/* ---------- 云服务：足迹按钮与状态提示 ---------- */
.petit{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pk{font-family:var(--kai);font-size:13.5px;letter-spacing:.14em;padding:6px 18px;border:1px solid var(--red);
  background:rgba(168,52,42,.06);color:var(--red);border-radius:999px;cursor:pointer;transition:.25s}
.pk:hover:not(:disabled){background:var(--red);color:#fff}
.pk:disabled{border-color:var(--ink3);color:var(--ink3);background:transparent;cursor:default}
.pkn{font-family:var(--hei);font-size:12.5px;color:var(--ink2);letter-spacing:.06em}
.cnote{font-family:var(--hei);font-size:12.5px;color:var(--ink3);text-align:center;margin:16px 0 0;
  letter-spacing:.06em;line-height:1.9}
.cnote.warn{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="seal">娄底<br>印象</div>
  <h1 class="title">涟水湘山<em>俱</em>有灵</h1>
  <p class="subtitle">娄底古风游览图</p>
  <div class="rule"><i></i><span>湘中腹地 · 十六处山水人文</span><i></i></div>
  <p class="disc">配诗说明：娄底本地现存的唐人题咏极少，图上所引唐诗<b>多为意境借引，非咏此地之作</b>，每张卡片均已注明；与本地乡贤或风土直接相关者另标<b>本地文献</b>，与本地相涉而并非专咏此地者标<b>相关文献</b>；确无可相合者<b>宁可不配</b>，不作攀附。插画同为古风意象画，非本地实景。</p>
</header>

<div class="bar" id="filters">
  <button class="chip on" data-f="all">全部</button>
  <button class="chip" data-f="山">山水</button>
  <button class="chip" data-f="人">人文</button>
  <button class="chip" data-f="物">风物</button>
  <button class="chip go" id="roam">▶ 漫游模式</button>
</div>

<div class="stage">
  <div class="mapbox">
  <svg viewBox="0 0 1000 760" id="map" aria-label="娄底古风游览图">
    <defs>
      <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="t"/>
        <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
      <radialGradient id="seaG"><stop offset="0%" stop-color="#dce9ea" stop-opacity=".85"/><stop offset="100%" stop-color="#dce9ea" stop-opacity="0"/></radialGradient>
    </defs>

    <!-- 远山 -->
    <g opacity=".5" filter="url(#ink)">
      <path d="M40,300 L120,190 L190,290 L260,150 L340,300 L420,175 L500,300 L580,165 L660,300 L740,180 L820,300 L900,200 L970,300"
            fill="none" stroke="#8aa39b" stroke-width="2" opacity=".55"/>
      <path d="M0,470 L80,375 L165,470 L250,350 L340,470 L430,365 L520,470 L610,355 L700,470 L790,370 L880,470 L1000,400"
            fill="none" stroke="#a8bbb2" stroke-width="1.6" opacity=".45"/>
    </g>

    <!-- 娄底写意轮廓 -->
    <g filter="url(#ink)">
      <path d="M262,150 C205,205 178,262 186,330 C176,392 200,440 232,486
               C252,540 250,606 292,646 C344,692 430,700 512,688
               C596,676 664,706 726,676 C788,646 800,586 786,528
               C774,472 800,432 782,382 C762,326 776,268 738,218
               C700,168 640,148 566,142 C492,136 424,124 372,132
               C324,139 288,134 262,150 Z"
            fill="rgba(107,98,89,.075)" stroke="#5d564d" stroke-width="2.2" opacity=".85"/>
    </g>

    <!-- 山脉写意 -->
    <g stroke="#8a9c94" stroke-width="1.5" fill="none" opacity=".7">
      <path d="M170,236 l26,-34 26,34"/><path d="M226,196 l32,-42 32,42"/>
      <path d="M292,262 l24,-32 24,32"/><path d="M232,404 l30,-40 30,40"/>
      <path d="M320,566 l34,-44 34,44"/><path d="M372,432 l26,-34 26,34"/>
      <path d="M470,168 l30,-40 30,40"/><path d="M556,132 l26,-34 26,34"/>
      <path d="M436,382 l34,-44 34,44"/><path d="M614,470 l28,-36 28,36"/>
      <path d="M690,588 l30,-40 30,40"/><path d="M636,672 l26,-34 26,34"/>
      <path d="M760,520 l28,-36 28,36"/>
    </g>

    <!-- 水系 -->
    <g fill="none" stroke-linecap="round">
      <path class="wave" d="M508,118 C524,182 478,238 500,300 C522,372 560,418 544,470 C528,532 570,562 600,612 C632,666 662,704 692,752" stroke-width="3"/>
      <path class="wave" d="M418,170 C434,238 470,298 464,358 C458,420 490,458 520,512" stroke-width="2.2" style="animation-delay:-1.2s"/>
      <path class="wave" d="M150,326 C172,398 162,470 178,542 C192,612 184,682 194,754" stroke-width="2.6" style="animation-delay:-2.1s"/>
      <path class="wave" d="M356,262 C382,300 372,344 394,386" stroke-width="1.6" opacity=".55" style="animation-delay:-.6s"/>
    </g>

    <!-- 云雾 -->
    <g>
      <ellipse class="cloud mist" cx="300" cy="228" rx="120" ry="34" fill="#fffdf6" opacity=".2" filter="url(#soft)"/>
      <ellipse class="cloud2 mist" cx="640" cy="330" rx="140" ry="30" fill="#fffdf6" opacity=".17" filter="url(#soft)"/>
      <ellipse class="cloud mist" cx="470" cy="600" rx="120" ry="26" fill="#fffdf6" opacity=".15" filter="url(#soft)" style="animation-delay:-2.5s"/>
    </g>

    <!-- 县名 -->
    <g>
      <text class="ctext" x="200" y="330" transform="rotate(-4 200 330)">冷水江</text>
      <text class="ctext" x="392" y="668">新　化</text>
      <text class="ctext" x="448" y="336">涟　源</text>
      <text class="ctext" x="700" y="452">双　峰</text>
      <text class="ctext" x="646" y="404">娄底</text>
    </g>

    <!-- 热点 -->
    <g id="hots"></g>

    <!-- 图例 -->
    <g id="legend" transform="translate(806,700)">
      <circle cx="0" cy="-4" r="5" fill="#4e7a72"/><text class="t" x="12" y="0">山水</text>
      <circle cx="66" cy="-4" r="5" fill="#a8342a"/><text class="t" x="78" y="0">人文</text>
      <circle cx="132" cy="-4" r="5" fill="#b08d57"/><text class="t" x="144" y="0">风物</text>
      <text class="t" x="0" y="26" style="font-size:12px;opacity:.75">点朱砂处 · 展卷</text>
    </g>
  </svg>
  </div>

  <div class="panel">
    <div class="card" id="card">
      <div class="empty">轻点图上朱砂之处<br>展开一幅娄底的山水与人文</div>
    </div>
  </div>
</div>

<div class="tl">
  <h3 class="tlh">人文脉络 · 一条时间轴</h3>
  <div class="era" id="era"></div>
  <div class="persons" id="persons"></div>
</div>

<p class="cnote" id="cnote"></p>

<footer>
  涟水湘山俱有灵　其秀气必钟英哲<br>
  （清 · 曾国藩题湘乡书院联，借其语冠于卷首）<br>
  诗画说明：所引唐诗多为意境借引、非咏此地之作（卡片内均已注明）；插画为古风意象画，非本地实景 · 出行请以景区公告为准
</footer>

/* ============ 云服务（WorkBuddy Cloud Service） ============
   endpoint / publishableKey 均来自开通云服务返回的 publicConfig，
   由构建脚本注入（见 data/cloud_config.py），切勿手工改写。 */
const CLOUD_CFG = {
  endpoint: "https://loudi-ancient-tour-map.app.workbuddy.host",
  publishableKey: "wbpk_ld7Bi6uuH9kg3NW89S5QzB_VMAFirTQy7jXSuP3RomE9367do1DN49Pk"
};
const SDK_URL = "https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js";
let _cloud = false;                 // false=未初始化 / null=不可用 / 对象=就绪
let VISITS = Object.create(null);   // spot_key -> 云端打卡数
let cloudLoaded = false;            // 云端景点内容是否已生效

function loadSDK(cb){
  if(window.WorkBuddyCloud) return cb(null);
  const s = document.createElement("script");
  s.src = SDK_URL;
  s.onload = ()=>cb(null);
  s.onerror = ()=>cb(new Error("sdk-load-failed"));
  document.head.appendChild(s);
}
function cloudClient(){
  if(_cloud !== false) return _cloud;
  if(!(window.WorkBuddyCloud && window.WorkBuddyCloud.createWorkBuddyCloud)){ _cloud = null; return null; }
  try{
    _cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: CLOUD_CFG.endpoint,
      publishableKey: CLOUD_CFG.publishableKey
    });
  }catch(e){ _cloud = null; }
  return _cloud;
}

/* 本机足迹（仅用于按钮状态，不作权限判断） */
const PK_STORE = "loudi_petit_v1";
function pkSet(){ try{ return new Set(JSON.parse(localStorage.getItem(PK_STORE)||"[]")); }catch(e){ return new Set(); } }
function pkSave(k){ try{ const s=pkSet(); s.add(k); localStorage.setItem(PK_STORE, JSON.stringify([...s])); }catch(e){} }

function setNote(text, warn){
  const el = document.getElementById("cnote");
  if(!el) return;
  el.textContent = text || "";
  el.className = "cnote" + (warn ? " warn" : "");
}

/* 拉云端：景点文案（覆盖内置文本，保留内置图片与坐标）+ 打卡计数 */
function loadCloud(){
  return new Promise(resolve=>{
    loadSDK(err=>{
      const c = cloudClient();
      if(err || !c){
        setNote("云端服务未能连接：内容按内置版本显示，足迹暂不可保存。", true);
        return resolve("offline");
      }
      const jobs = [
        c.database.from("loudi_spots").select("spot_key,payload").order("sort_no").then(({data,error})=>{
          if(error) throw error;
          if(Array.isArray(data) && data.length){
            const by = Object.create(null); SPOTS.forEach(s=>{ by[s.k]=s; });
            data.forEach(row=>{
              const t = by[row.spot_key], p = row.payload;
              if(!t || !p) return;
              Object.keys(p).forEach(k=>{ if(k!=="img" && k!=="x" && k!=="y") t[k]=p[k]; });
            });
            cloudLoaded = true;
          }
        }),
        c.database.rpc("loudi_visit_stats").then(({data,error})=>{
          if(error) throw error;
          (data||[]).forEach(r=>{ VISITS[r.spot_key] = Number(r.visits)||0; });
        })
      ];
      Promise.all(jobs)
        .then(()=>{
          if(!cloudLoaded){ setNote("云端内容暂不可用，正在显示内置版本。", true); return resolve("partial"); }
          const total = Object.keys(VISITS).reduce((a,k)=>a+VISITS[k], 0);
          setNote("全图已有 " + total + " 人留下足迹");
          resolve("ok");
        })
        .catch(()=>{ setNote("云端内容暂不可用，正在显示内置版本。", true); resolve("partial"); });
    });
  });
}

/* 到此一游 */
function paintPetit(key, btn, cnt){
  const n = VISITS[key] || 0;
  cnt.textContent = n>0 ? ("已有 "+n+" 人到过此处") : "还没有人留下足迹";
  if(pkSet().has(key)){ btn.disabled = true; btn.textContent = "◈ 已到此一游"; }
  else { btn.disabled = false; btn.textContent = "◈ 我到此一游"; }
}
async function petit(key, btn, cnt){
  const c = cloudClient();
  if(!c){ cnt.textContent = "云端未连接，足迹未能保存"; return; }
  btn.disabled = true; btn.textContent = "▷ 正在留下足迹…";
  try{
    const { error } = await c.database.from("loudi_visits").insert({ spot_key: key });
    if(error) throw error;
  }catch(e){
    btn.disabled = false; btn.textContent = "◈ 我到此一游";
    cnt.textContent = "足迹未能保存，请稍后重试";
    return;
  }
  VISITS[key] = (VISITS[key]||0) + 1;
  pkSave(key);
  paintPetit(key, btn, cnt);
}

/* ---- 渲染热点 ---- */
const map = document.getElementById('hots');
const NS = 'http://www.w3.org/2000/svg';
SPOTS.forEach((s,i)=>{
  const g = document.createElementNS(NS,'g');
  g.setAttribute('class','hot'+(s.cat==='山'?'':''));
  g.dataset.f = s.cat; g.dataset.i = i; g.dataset.c = s.cat;
  g.innerHTML =
    `<circle class="ring" cx="${s.x}" cy="${s.y}" r="6"/>
     <circle class="ring ring2" cx="${s.x}" cy="${s.y}" r="6"/>
     <circle class="dot" cx="${s.x}" cy="${s.y}" r="5.5"/>
     <text class="lbl" x="${s.x+(s.x>560?-14:14)}" y="${s.y-10}" text-anchor="${s.x>560?'end':'start'}">${s.name}</text>
     <text class="lbl2" x="${s.x+(s.x>560?-14:14)}" y="${s.y+14}" text-anchor="${s.x>560?'end':'start'}">${s.place}</text>`;
  g.addEventListener('click',()=>{stopRoam();show(i);});
  map.appendChild(g);
});

/* ---- 列表 ---- */
const card = document.getElementById('card');
let cur = -1;
function show(i){
  const s = SPOTS[i]; cur = i;
  const q = (s.qline||[]).map(t=>t).join('，');
  const quote = s.poem ? `
        <div class="quote">
          <div class="qlab">${s.klass==='本'?'本地文献':(s.klass==='关'?'相关文献 · 非专咏此地':'唐诗意境 · 非咏此地')}</div>
          <div class="qt">${q}</div>
          <div class="qa">— ${s.poem}　${s.author}</div>
          ${s.note?`<div class="qn">${s.note}</div>`:''}
        </div>` : `
        <div class="quote nopoem">
          <div class="qlab">此处不配诗</div>
          <div class="qn">${s.note||''}</div>
        </div>`;
  const full = s.full ? `<div class="full" id="full">${s.full.join('　/　')}</div>
     <div class="more" id="more">▽ 展开全篇</div>` : '';
  const others = (s.others||[]).map(o=>`<span class="tag r">${o}</span>`).join('');
  card.innerHTML = `
    <div class="crow tin">
      <div class="pic"><img src="${s.img}" alt="${s.name}"><div class="piccap">${s.imgcap||'古风意象画 · 非本地实景'}</div></div>
      <div class="info">
        <h2 class="cn">${s.name}</h2>
        <div class="cloc">${s.place}　|　${s.area}</div>
        <div class="ctags"><span class="tag">${s.cat}</span>${others}</div>
        ${quote}
        <div class="body">${s.desc.map(p=>`<p>${p}</p>`).join('')}</div>
        ${s.kv ? `<div class="kv">${s.kv.map(r=>`<b>${r[0]}</b><span>${r[1]}</span>`).join('')}</div>`:''}
        <div class="tips"><b>游　　记</b>　${s.tips}</div>
        <div class="petit"><button class="pk" id="pkbtn">◈ 我到此一游</button><span class="pkn" id="pkn"></span></div>
        ${full}
      </div>
    </div>`;
  const pb = card.querySelector('#pkbtn'), pc = card.querySelector('#pkn');
  if(pb && pc){ paintPetit(s.k, pb, pc); pb.onclick = ()=>petit(s.k, pb, pc); }
  const m = card.querySelector('#more');
  if(m) m.onclick=()=>{const f=card.querySelector('#full');f.classList.toggle('on');
    m.textContent = f.classList.contains('on')?'△ 收起全篇':'▽ 展开全篇';};
  const f = document.getElementById('filters').dataset.f || 'all';
  [...document.querySelectorAll('.hot')].forEach(h=>{
    h.classList.toggle('act', +h.dataset.i===i);
    h.style.opacity = (f!=='all' && SPOTS[i].cat!==f) ? .3 : 1;
  });
}

/* ---- 筛选 ---- */
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.chip');
  if(!b) return;
  stopRoam();
  const f = b.dataset.f;
  document.getElementById('filters').dataset.f = f;
  [...document.querySelectorAll('.chip[data-f]')].forEach(c=>c.classList.toggle('on',c===b));
  [...document.querySelectorAll('.hot')].forEach(h=>{
    const sp=SPOTS[+h.dataset.i];
    const showIt = f==='all'||sp.cat===f;
    h.style.display = showIt?'':'none';
    h.style.opacity = (f!=='all'&&showIt)?1:.3;
  });
  if(f!=='all'){
    const first = SPOTS.findIndex(s=>s.cat===f);
    if(first>=0) show(first);
  }
});

/* ---- 漫游 ---- */
let timer=null;
function stopRoam(){
  if(timer){clearInterval(timer);timer=null;
    const b=document.getElementById('roam');b.classList.remove('on');b.textContent='▶ 漫游模式';}
  document.documentElement.style.scrollBehavior='auto';
}
document.getElementById('roam').onclick=function(){
  if(timer){stopRoam();return;}
  this.classList.add('on');this.textContent='■ 停止漫游';
  const f=document.getElementById('filters').dataset.f||'all';
  const list=SPOTS.map((s,i)=>i).filter(i=>f==='all'||SPOTS[i].cat===f);
  let k=0;
  const step=()=>{show(list[k%list.length]);k++;}
  step();
  document.documentElement.style.scrollBehavior='smooth';
  timer=setInterval(step,4200);
};

/* ---- 时间轴 ---- */
document.getElementById('era').innerHTML = ERAS.map(e=>
  `<div><b>${e.t}</b><s>${e.y}</s><i>${e.d}</i></div>`).join('');
document.getElementById('persons').innerHTML = ERAS.map(e=>
  `<b>${e.t}</b> ${e.p||''}`).join('　·　');

/* ---- 锚点直达（#序号，便于分享定位） ---- */
(function(){
  const h = parseInt(location.hash.slice(1));
  if(!isNaN(h) && h>=0 && h<SPOTS.length) show(h);
})();

/* ---- 启动：连云端，内容取回后刷新当前展开的卡片 ---- */
loadCloud().then(()=>{ if(cur>=0) show(cur); });
</script>
