<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3ead7" />
  <meta name="description" content="诗游·地名搜诗 — 以地名为线索，游读唐诗三百首" />
  <title>诗游 · 地名搜诗</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <div id="loading" class="loading">墨韵装载中…</div>

    <div id="app-main" hidden>
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">游</div>
          <div>
            <h1>诗游</h1>
            <div class="sub">地名搜诗</div>
          </div>
        </div>
        <div class="search-wrap">
          <input id="search" type="search" enterkeyhint="search" autocomplete="off"
            placeholder="输入地名，如 黄鹤楼、苏州、西安、武威" />
          <button type="button" id="clear-btn" class="clear-btn" aria-label="清除">×</button>
        </div>
      </header>

      <section id="view-home" class="view active">
        <div id="hot-section">
          <div class="section-label">热门地名</div>
          <div id="chips" class="chips"></div>
        </div>
        <div class="section-label" id="results-label">成片精选</div>
        <div id="results" class="results"></div>
        <div class="footer-note">唐诗三百首 · 十卡成片 · 纯静态</div>
      </section>

      <section id="view-detail" class="view">
        <div class="detail-bar">
          <button type="button" class="back-link" id="btn-back">← 返回</button>
          <h2 id="detail-title"></h2>
        </div>
        <div id="detail-body"></div>
      </section>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
